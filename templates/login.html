<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISAILO MAPS — Iniciar Sesión</title>

    <link rel="stylesheet" href="../static/logincss.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="login-decor login-decor--1"></div>
    <div class="login-decor login-decor--2"></div>
    <div class="login-decor login-decor--3"></div>
    <div class="login-decor login-decor--4"></div>
    <div class="login-decor login-decor--5"></div>

    <div class="login-card" id="loginCard">

        <div class="login-logo-wrap">
            <img src="../static/logo.png" alt="ISAILO MAPS" class="login-logo" id="loginLogo">
            <div class="login-brand">ISAILO MAPS</div>
            <div class="login-brand-sub">Instituto San Ignacio de Loyola</div>
        </div>

        <h1 class="login-title">Inicio de Sesión</h1>
        <p class="login-subtitle">Ingresa tus credenciales para acceder a la plataforma</p>

        <div class="login-error" id="loginError">
            <i class="fas fa-exclamation-circle"></i>
            <span id="loginErrorText">Credenciales incorrectas. Intenta nuevamente.</span>
        </div>

        <form id="loginForm" autocomplete="off">

            <div class="login-field">
                <label class="login-label" for="loginUser">
                    <i class="fas fa-user"></i> Usuario o Correo
                </label>
                <input
                    class="login-input"
                    type="text"
                    id="loginUser"
                    placeholder="usuario@ejemplo.com"
                >
            </div>

            <div class="login-field">
                <label class="login-label" for="loginPass">
                    <i class="fas fa-lock"></i> Contraseña
                </label>
                <div class="login-password-wrap">
                    <input
                        class="login-input"
                        type="password"
                        id="loginPass"
                        placeholder="••••••••"
                    >
                    <button type="button" class="login-password-toggle" id="togglePass" aria-label="Mostrar contraseña">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Ingresar <i class="fas fa-arrow-right"></i>
            </button>

        </form>

        <div class="login-links">
            <a href="/" class="login-back">
                <i class="fas fa-arrow-left"></i> Volver al inicio
            </a>
        </div>

        <div class="login-admin-hint">
            <span>Acceso administrativo con credenciales institucionales</span>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            gsap.set('.login-decor--1', { scale: 0.6, opacity: 0 });
            gsap.set('.login-decor--2', { scale: 0.6, opacity: 0 });
            gsap.set('.login-decor--3', { scale: 0.4, opacity: 0, rotation: -30 });
            gsap.set('.login-decor--4', { scale: 0, opacity: 0 });
            gsap.set('.login-decor--5', { scaleY: 0, opacity: 0, transformOrigin: 'top center' });
            gsap.set('.login-card', { y: 50, opacity: 0, scale: 0.95 });
            gsap.set('.login-logo', { scale: 0, opacity: 0, rotation: -180 });
            gsap.set('.login-brand', { y: 25, opacity: 0 });
            gsap.set('.login-brand-sub', { y: 15, opacity: 0 });
            gsap.set('.login-title', { y: 25, opacity: 0 });
            gsap.set('.login-subtitle', { y: 20, opacity: 0 });
            gsap.set('.login-field', { x: -20, opacity: 0 });
            gsap.set('.login-btn', { y: 25, opacity: 0 });
            gsap.set('.login-links', { y: 20, opacity: 0 });
            gsap.set('.login-admin-hint', { opacity: 0 });

            var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

            tl.to('.login-decor--1', { duration: 0.5, scale: 1, opacity: 1, ease: 'power2.out' })
              .to('.login-decor--2', { duration: 0.4, scale: 1, opacity: 1, ease: 'power2.out' }, '-=0.3')
              .to('.login-decor--3', { duration: 0.35, scale: 1, opacity: 1, rotation: 0, ease: 'back.out(1.4)' }, '-=0.25')
              .to('.login-decor--4', { duration: 0.3, scale: 1, opacity: 1, ease: 'back.out(1.2)' }, '-=0.2')
              .to('.login-decor--5', { duration: 0.3, scaleY: 1, opacity: 1, ease: 'power3.out' }, '-=0.15')
              .to('.login-card', { duration: 0.55, y: 0, opacity: 1, scale: 1, ease: 'power2.out' }, '-=0.2')
              .to('.login-logo', { duration: 0.5, scale: 1, opacity: 1, rotation: 0, ease: 'back.out(1.2)' }, '-=0.3')
              .to('.login-brand', { duration: 0.35, y: 0, opacity: 1 }, '-=0.2')
              .to('.login-brand-sub', { duration: 0.3, y: 0, opacity: 1 }, '-=0.15')
              .to('.login-title', { duration: 0.35, y: 0, opacity: 1 }, '-=0.1')
              .to('.login-subtitle', { duration: 0.3, y: 0, opacity: 1 }, '-=0.1')
              .to('.login-field', { duration: 0.35, x: 0, opacity: 1, stagger: 0.06, ease: 'power2.out' }, '-=0.1')
              .to('.login-btn', { duration: 0.4, y: 0, opacity: 1, ease: 'back.out(1.2)', onComplete: pulseGlow }, '-=0.05')
              .to('.login-links', { duration: 0.3, y: 0, opacity: 1 }, '-=0.05')
              .to('.login-admin-hint', { duration: 0.3, opacity: 1 }, '-=0.05');

            function pulseGlow() {
                gsap.to('.login-btn', {
                    duration: 1,
                    boxShadow: '0 8px 36px rgba(139,30,30,0.5), 0 0 60px rgba(139,30,30,0.12)',
                    repeat: 1,
                    yoyo: true,
                    ease: 'sine.inOut',
                    delay: 0.4
                });
            }

            document.getElementById('togglePass').addEventListener('click', function () {
                var input = document.getElementById('loginPass');
                var icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });

            document.getElementById('loginForm').addEventListener('submit', function (e) {
                e.preventDefault();

                var user = document.getElementById('loginUser').value.trim();
                var pass = document.getElementById('loginPass').value;
                var errorEl = document.getElementById('loginError');
                var errorText = document.getElementById('loginErrorText');

                errorEl.classList.remove('login-error--visible');

                if (!user || !pass) {
                    errorText.textContent = 'Completa usuario y contraseña.';
                    errorEl.classList.add('login-error--visible');
                    gsap.fromTo(errorEl, { x: -10 }, { duration: 0.35, x: 0, ease: 'power3.out' });
                    return;
                }

                fetch('/api/clientes/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo: user, password: pass })
                })
                .then(function (resp) { return resp.json(); })
                .then(function (res) {
                    if (res.ok && res.panel) {
                        gsap.to('.login-card', {
                            duration: 0.5,
                            scale: 0.92,
                            opacity: 0,
                            y: -30,
                            ease: 'power3.in',
                            onComplete: function () {
                                window.location.href = res.panel;
                            }
                        });
                    } else {
                        errorText.textContent = res.error || 'Credenciales incorrectas. Intenta nuevamente.';
                        errorEl.classList.add('login-error--visible');
                        gsap.fromTo(errorEl, { x: -10 }, { duration: 0.35, x: 0, ease: 'power3.out' });
                    }
                })
                .catch(function () {
                    errorText.textContent = 'No se pudo conectar con el servidor. Intenta nuevamente.';
                    errorEl.classList.add('login-error--visible');
                    gsap.fromTo(errorEl, { x: -10 }, { duration: 0.35, x: 0, ease: 'power3.out' });
                });
            });

            document.getElementById('loginUser').addEventListener('input', function () {
                this.classList.remove('login-input--error');
                document.getElementById('loginError').classList.remove('login-error--visible');
            });

            document.getElementById('loginPass').addEventListener('input', function () {
                document.getElementById('loginError').classList.remove('login-error--visible');
            });

            document.querySelectorAll('.login-input').forEach(function (el) {
                el.addEventListener('focus', function () {
                    gsap.to(this, { duration: 0.25, borderColor: 'rgba(230,215,184,0.35)', ease: 'power2.out' });
                });
                el.addEventListener('blur', function () {
                    if (!this.classList.contains('login-input--error')) {
                        gsap.to(this, { duration: 0.3, borderColor: 'rgba(230,215,184,0.10)', ease: 'power2.out' });
                    }
                });
            });

        });
    </script>

</body>
</html>
