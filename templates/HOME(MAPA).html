/* Fondo que cubre la pantalla */
.modal-reserva {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    justify-content: flex-end;
    background: rgba(20, 23, 45, 0.60);
}

/* Ocultar el panel */
.modal-reserva.oculto {
    display: none;
}

/* Panel lateral */
.panel-reserva {
    width: min(440px, 100%);
    height: 100%;
    overflow-y: auto;
    padding: 26px;
    background: #ffffff;
    color: #25283b;
    box-shadow: -8px 0 30px rgba(0, 0, 0, 0.18);
}

.encabezado-reserva {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 24px;
}

.encabezado-reserva h2 {
    font-size: 1.35rem;
    margin-bottom: 6px;
}

.encabezado-reserva p {
    color: #73788a;
    font-size: 0.9rem;
}

.cerrar-reserva {
    border: none;
    background: transparent;
    font-size: 1.7rem;
    cursor: pointer;
    color: #555b70;
}

.formulario-reserva {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.campo-reserva {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.campo-reserva label {
    font-size: 0.9rem;
    font-weight: 600;
}

.campo-reserva input,
.campo-reserva textarea,
.campo-reserva select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d9deea;
    border-radius: 7px;
    font: inherit;
    background: #fff;
    color: #25283b;
}

.campo-reserva textarea {
    min-height: 100px;
    resize: vertical;
}

.horas-reserva {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.acciones-reserva {
    display: flex;
    gap: 12px;
    margin-top: 12px;
}

.acciones-reserva button {
    flex: 1;
    padding: 13px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 600;
}

.btn-cancelar-reserva {
    border: 1px solid #d9deea;
    background: white;
    color: #33384b;
}

.btn-enviar-reserva {
    border: none;
    background: #8b0000;
    color: white;
}

.btn-enviar-reserva:hover {
    background: #660000;
}

.mensaje-reserva {
    padding: 12px;
    border-radius: 7px;
    background: #edf6ff;
    color: #8b0000;
    font-size: 0.9rem;
}

@media (max-width: 480px) {
    .panel-reserva {
        padding: 20px;
    }
}

     .boton-piso:hover {
    background: #eaf0ff;
}

.boton-piso.activo {
    background: #8b0000;
    color: white;
    border-color: #8b0000;
}

@media (max-width: 600px) {
    .filtro_mapa {
        align-items: flex-start;
        flex-direction: column;
    }

    .selector-pisos {
        justify-content: flex-start;
    }
}
        

/* El plano será la referencia para posicionar el resaltado */
.contenedor-mapas > div[class^="s_"] {
    position: relative;
}

/* Capa SVG que se dibujará sobre el plano */
.capa-resaltado {
    position: absolute;
    pointer-events: none;
    z-index: 2;
    overflow: visible;
}

.capa-resaltado .espacio-resaltado {
    fill: rgba(218, 165, 32, 0.35);
    stroke: #e4b638;
    stroke-width: 3;
    stroke-linejoin: round;
    opacity: 0;
    transition: opacity 150ms ease;
}

.capa-resaltado .espacio-resaltado.activo {
    opacity: 1;
}


#mapa-general-vista {
    position: relative;
}

#mapa-general-vista > img.mapa-general {
    display: block;
    max-width: 100%;
}

#mapa-general-vista > .capa-resaltado {
    position: absolute;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
}

// Mantener las zonas activas incluso si no carga el ajustador externo.
if (typeof window.imageMapResize !== "function") {
    window.imageMapResize = function () {
        document.querySelectorAll("map").forEach(function (mapa) {
            const imagen = document.querySelector('img[usemap="#' + mapa.name + '"]');
            if (!imagen || !imagen.naturalWidth || !imagen.clientWidth) return;
            const escalaX = imagen.clientWidth / imagen.naturalWidth;
            const escalaY = imagen.clientHeight / imagen.naturalHeight;
            mapa.querySelectorAll("area").forEach(function (area) {
                const originales = (area.dataset.coordenadasOriginales || "").split(",").map(Number);
                area.coords = originales.map(function (valor, indice) {
                    return Math.round(valor * (indice % 2 === 0 ? escalaX : escalaY));
                }).join(",");
            });
        });
    };
    window.addEventListener("resize", window.imageMapResize);
    document.querySelectorAll('img[usemap]').forEach(function (imagen) {
        if (imagen.complete) window.imageMapResize();
        else imagen.addEventListener("load", window.imageMapResize);
    });
}

    function conectarTooltip(elemento, texto) {
        if (!tooltipMapa || !texto) return;
        elemento.setAttribute("aria-label", texto);
        elemento.setAttribute("aria-describedby", "mapa-tooltip");
        elemento.removeAttribute("title");

        function mostrar(evento) {
            tooltipMapa.textContent = texto;
            tooltipMapa.hidden = false;
            tooltipMapa.dataset.visible = "true";

            const rectangulo = elemento.getBoundingClientRect();
            const x = evento && evento.type !== "focus"
                ? evento.clientX
                : rectangulo.left + rectangulo.width / 2;
            const y = evento && evento.type !== "focus"
                ? evento.clientY
                : rectangulo.top + rectangulo.height / 2;

            window.requestAnimationFrame(function () {
                const margen = 10;
                const separacion = 14;
                const ancho = tooltipMapa.offsetWidth;
                const alto = tooltipMapa.offsetHeight;
                let izquierda = x + separacion;
                let arriba = y + separacion;
                if (izquierda + ancho > window.innerWidth - margen) izquierda = x - ancho - separacion;
                if (arriba + alto > window.innerHeight - margen) arriba = y - alto - separacion;
                tooltipMapa.style.left = Math.max(margen, izquierda) + "px";
                tooltipMapa.style.top = Math.max(margen, arriba) + "px";
            });
        }

        function ocultar() {
            tooltipMapa.dataset.visible = "false";
            tooltipMapa.hidden = true;
        }

        elemento.addEventListener("mouseenter", mostrar);
        elemento.addEventListener("mousemove", mostrar);
        elemento.addEventListener("mouseleave", ocultar);
        elemento.addEventListener("focus", mostrar);
        elemento.addEventListener("blur", ocultar);
    }

function prepararResaltado(map) {
    const imagen = document.querySelector(
        `img[usemap="#${map.name}"]`
    );

    if (!imagen) {
        console.warn("No se encontró la imagen:", map.name);
        return;
    }

    const contenedor = imagen.parentElement;

    // La capa debe usar exactamente el área de la imagen.
    contenedor.style.position = "relative";
    imagen.style.display = "block";

    let svg = contenedor.querySelector(".capa-resaltado");

    if (!svg) {
        svg = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );

        svg.classList.add("capa-resaltado");
        contenedor.appendChild(svg);
    }

    
function actualizarCapa() {
    if (!imagen.naturalWidth || !imagen.naturalHeight) return;

    const imagenRect = imagen.getBoundingClientRect();
    const contenedorRect = contenedor.getBoundingClientRect();

    svg.setAttribute(
        "viewBox",
        `0 0 ${imagen.naturalWidth} ${imagen.naturalHeight}`
    );

    // Posición real de la imagen respecto a su contenedor.
    svg.style.left =
        `${imagenRect.left - contenedorRect.left - contenedor.clientLeft}px`;

    svg.style.top =
        `${imagenRect.top - contenedorRect.top - contenedor.clientTop}px`;

    svg.style.width = `${imagenRect.width}px`;
    svg.style.height = `${imagenRect.height}px`;
}


    function crearFigura(area) {
        // Leer las coordenadas originales, no las modificadas
        // por imageMapResize().
        const coordsOriginales =
            area.dataset.coordenadasOriginales ||
            area.getAttribute("coords");

        const coordenadas = coordsOriginales
            .split(",")
            .map(Number);

        const forma = (area.getAttribute("shape") || "rect")
            .toLowerCase();

        let figura;

        if (forma === "poly" || forma === "polygon") {
            figura = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "polygon"
            );

            const puntos = [];

            for (let i = 0; i < coordenadas.length; i += 2) {
                puntos.push(
                    `${coordenadas[i]},${coordenadas[i + 1]}`
                );
            }

            figura.setAttribute("points", puntos.join(" "));
        } else if (forma === "circle" || forma === "circ") {
            figura = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );

            figura.setAttribute("cx", coordenadas[0]);
            figura.setAttribute("cy", coordenadas[1]);
            figura.setAttribute("r", coordenadas[2]);
        } else {
            figura = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "rect"
            );

            figura.setAttribute("x", coordenadas[0]);
            figura.setAttribute("y", coordenadas[1]);
            figura.setAttribute(
                "width",
                coordenadas[2] - coordenadas[0]
            );
            figura.setAttribute(
                "height",
                coordenadas[3] - coordenadas[1]
            );
        }

        figura.classList.add("espacio-resaltado");
        svg.appendChild(figura);

        area.addEventListener("mouseenter", () => {
            svg.querySelectorAll(".activo").forEach(elemento => {
                elemento.classList.remove("activo");
            });

            figura.classList.add("activo");
        });

        area.addEventListener("mouseleave", () => {
            figura.classList.remove("activo");
        });
    }

    map.querySelectorAll("area").forEach(crearFigura);

    // Actualizar después de cargar la imagen.
    if (imagen.complete) {
        actualizarCapa();
    } else {
        imagen.addEventListener("load", actualizarCapa, { once: true });
    }

    // Actualizar cuando cambie el tamaño del plano.
    if ("ResizeObserver" in window) {
        const observador = new ResizeObserver(actualizarCapa);
        observador.observe(imagen);
    } else {
        window.addEventListener("resize", actualizarCapa);
    }

    actualizarCapa();



    // Mantener el resaltado alineado al cambiar el tamaño.
    if ("ResizeObserver" in window) {
        const observador = new ResizeObserver(actualizarCapa);
        observador.observe(imagen);
    } else {
        window.addEventListener("resize", actualizarCapa);
    }
}

            ),

            nombre_actividad: document.getElementById(
                "nombre-actividad"
            ).value.trim(),

            descripcion_actividad: document.getElementById(
                "descripcion-actividad"
            ).value.trim(),

            id_espacio: espacioSeleccionado
        };

        console.log(
            "Solicitud de reserva de prueba:",
            datosPrueba
        );

        mensaje.textContent =
            "Formulario validado. La solicitud es una simulación; " +
            "todavía no se ha guardado.";

        mensaje.hidden = false;
    });

   
    // 14. EVITAR FECHAS ANTERIORES A HOY
   
    const hoy = new Date();

    const fechaLocal = [
        hoy.getFullYear(),
        String(hoy.getMonth() + 1).padStart(2, "0"),
        String(hoy.getDate()).padStart(2, "0")
    ].join("-");

    fechaUso.min = fechaLocal;
    } else {
        let zonasPermitidas = null;
        window.addEventListener("message", function (event) {
            if (event.origin !== window.location.origin || event.source !== window.parent) return;
            if (event.data && event.data.tipo === "filtrar-zonas-mapa" && Array.isArray(event.data.zonas)) {
                zonasPermitidas = new Set(event.data.zonas);
            } else if (event.data && event.data.tipo === "recalcular-mapa") {
                requestAnimationFrame(function () {
                    if (typeof window.imageMapResize === "function") window.imageMapResize();
                    window.dispatchEvent(new Event("resize"));
                });
            }
        });
        document.querySelectorAll(".contenedor-mapas area[data-espacio]").forEach(function (area) {
            const identificador = area.dataset.espacio || "";
            const partes = identificador.match(/^([a-f])(\d)-(.+)$/i);
            const nombreCrudo = area.dataset.nombre || area.title || area.alt || "Espacio";
            const claveNombre = nombreCrudo.toLowerCase().trim().replace(/[\s-]+/g, "_");
            const nombreEspacio = nombresEspaciosMapa[claveNombre] || nombreCrudo.replace(/_/g, " ");
            let textoTooltip = nombreEspacio;
            if (partes) {
                const codigoEdificio = partes[1].toUpperCase();
                const codigoPiso = (partes[1] + partes[2]).toUpperCase();
                textoTooltip += " · Edificio " + codigoEdificio + " (" +
                    nombreEdificioPorCodigo[codigoEdificio] + "), " +
                    nombreNivel(codigoPiso) + " (" + codigoPiso + ")";
            }
            conectarTooltip(area, textoTooltip);

            area.addEventListener("click", function (event) {
                event.preventDefault();
                if (document.body.dataset.vistaPublica === "true") return;
                if (zonasPermitidas && !zonasPermitidas.has(area.dataset.espacio)) return;
                window.parent.postMessage({
                    tipo: "seleccionar-espacio-mapa",
                    identificador: area.dataset.espacio,
                    nombre: area.dataset.nombre || area.title || area.alt
                }, window.location.origin);
            });
        });
    }

});
</script>


<!-- PANEL DE RESERVA -->
<div id="modal-reserva" class="modal-reserva oculto">

    <section
        class="panel-reserva"
        role="dialog"
        aria-modal="true"
        aria-labelledby="titulo-reserva"
    >

        <header class="encabezado-reserva">
            <div>
                <h2 id="titulo-reserva">Reservar espacio</h2>
                <p id="nombre-espacio">Selecciona un salón</p>
            </div>

            <button
                type="button"
                id="cerrar-reserva"
                class="cerrar-reserva"
                aria-label="Cerrar formulario"
            >×</button>
        </header>

        <form id="formulario-reserva" class="formulario-reserva">

            <div class="campo-reserva">
                <label for="fecha-uso">Fecha de uso</label>
                <input
                    type="date"
                    id="fecha-uso"
                    name="fecha_uso"
                    required
                >
            </div>

            <div class="horas-reserva">
                <div class="campo-reserva">
                    <label for="hora-inicio">Hora de inicio</label>
                    <input
                        type="time"
                        id="hora-inicio"
                        name="hora_inicio"
                        required
                    >
                </div>

                <div class="campo-reserva">
                    <label for="hora-fin">Hora de fin</label>
                    <input
                        type="time"
                        id="hora-fin"
                        name="hora_fin"
                        required
                    >
                </div>
            </div>

            <div class="campo-reserva">
                <label for="cantidad-personas">Cantidad de personas</label>
                <input
                    type="number"
                    id="cantidad-personas"
                    name="cantidad_personas"
                    min="1"
                    step="1"
                    required
                >
            </div>

            <div class="campo-reserva">
                <label for="nombre-actividad">Nombre de la actividad</label>
                <input
                    type="text"
                    id="nombre-actividad"
                    name="nombre_actividad"
                    maxlength="150"
                    placeholder="Ej. Reunión de proyecto"
                    required
                >
            </div>

            <div class="campo-reserva">
                <label for="descripcion-actividad">
                    Descripción de la actividad
                </label>
                <textarea
                    id="descripcion-actividad"
                    name="descripcion_actividad"
                    maxlength="1000"
                    placeholder="Describe brevemente el propósito de la reserva"
                    required
                ></textarea>
            </div>

            <div
                id="mensaje-reserva"
                class="mensaje-reserva"
                role="status"
                hidden
            ></div>

            <div class="acciones-reserva">
                <button
                    type="button"
                    id="cancelar-reserva"
                    class="btn-cancelar-reserva"
                >Cancelar</button>

                <button
                    type="submit"
                    class="btn-enviar-reserva"
                >Solicitar reserva</button>
            </div>

        </form>
    </section>
</div>

</body>
</html>
