<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISAILO MAPS — Acceso Administrativo</title>

    <link rel="stylesheet" href="../static/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="admin-login">
        <div class="admin-login__decoracion admin-login__decoracion--1"></div>
        <div class="admin-login__decoracion admin-login__decoracion--2"></div>
        <div class="admin-login__decoracion admin-login__decoracion--3"></div>

        <div class="admin-login__tarjeta">
            <div class="admin-login__icono"><i class="fas fa-user-shield"></i></div>
            <h1 class="admin-login__titulo">Acceso Administrativo</h1>
            <p class="admin-login__subtitulo">Ingresa con tus credenciales institucionales</p>

            <div class="admin-login__error" id="loginError"></div>

            <form onsubmit="adminLogin(event)">
                <div class="admin-login__campo">
                    <label class="admin-login__label" for="loginUsuario">Usuario</label>
                    <input class="admin-login__input" type="text" id="loginUsuario" placeholder="admin">
                </div>
                <div class="admin-login__campo">
                    <label class="admin-login__label" for="loginContrasena">Contraseña</label>
                    <input class="admin-login__input" type="password" id="loginContrasena" placeholder="••••••••">
                </div>
                <button type="submit" class="admin-login__boton">
                    Ingresar <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <a class="admin-login__volver" href="index.html">
                <i class="fas fa-arrow-left"></i> Volver al inicio
            </a>
        </div>
    </div>

    <script src="../static/admin.js"></script>
</body>
</html>
